<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="txt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="50%" stop-color="#ff8c42"/>
      <stop offset="100%" stop-color="#8a2be2"/>
    </linearGradient>
  </defs>
  <rect width="900" height="150" rx="18" fill="url(#bg)"/>
  <text x="450" y="60" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700" fill="url(#txt)">
    <tspan>Pemuda Hilang Arah</tspan>
    <animate attributeName="opacity" values="1;0.5;1" dur="1.8s" repeatCount="indefinite"/>
  </text>
  <text x="450" y="100" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="19" fill="#a0c4ff">
    <tspan>yang kebetulan bisa coding (wibu)</tspan>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="2s" repeatCount="indefinite"/>
  </text>
</svg>
