<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e94560"/><stop offset="100%" stop-color="#ff8c42"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a2be2"/><stop offset="100%" stop-color="#4a9eff"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c853"/><stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
  </defs>
  <rect width="900" height="170" rx="18" fill="#12122a"/>
  <text x="30" y="48" font-family="Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#ff8c42">WAIFU COLLECTING</text>
  <rect x="30" y="58" width="840" height="14" rx="7" fill="#2a2a4a"/>
  <rect x="30" y="58" width="0" height="14" rx="7" fill="url(#g1)">
    <animate attributeName="width" values="0;840;840" dur="2s" fill="freeze" begin="0.2s"/>
  </rect>

  <text x="30" y="112" font-family="Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#4a9eff">GETTING LOST</text>
  <rect x="30" y="122" width="840" height="14" rx="7" fill="#2a2a4a"/>
  <rect x="30" y="122" width="0" height="14" rx="7" fill="url(#g2)">
    <animate attributeName="width" values="0;630;630" dur="2s" fill="freeze" begin="0.6s"/>
  </rect>

  <text x="30" y="168" font-family="Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#00e5ff">FUZZING</text>
  <rect x="30" y="178" width="840" height="14" rx="7" fill="#2a2a4a"/>
  <rect x="30" y="178" width="0" height="14" rx="7" fill="url(#g3)">
    <animate attributeName="width" values="0;420;420" dur="2s" fill="freeze" begin="1.0s"/>
  </rect>
</svg>
